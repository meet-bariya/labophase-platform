apiVersion: argoproj.io/v1beta1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  finalizers:
    - resources-finalizers.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/meet-bariya/labophase-platform.git
    targetRevision: main
    path: kubernetes/infrastructure/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
